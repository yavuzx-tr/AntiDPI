name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Compile Standalone Engine
        run: |
          cd bin/src
          go build -trimpath -ldflags "-s -w" -o ../antidpi.exe .

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "" -or $tag -like "*/*") { $tag = "v1.0.0" }
          $zipName = "AntiDPI-${tag}-windows-x64.zip"
          $dist = "dist_pkg"
          New-Item -ItemType Directory -Path "$dist/bin" -Force | Out-Null
          Copy-Item "bin/antidpi.exe" -Destination "$dist/bin/antidpi.exe"
          Copy-Item "run.bat" -Destination "$dist/run.bat"
          Copy-Item "reset.bat" -Destination "$dist/reset.bat"
          Copy-Item "autostart.bat" -Destination "$dist/autostart.bat"
          Copy-Item "README.md" -Destination "$dist/README.md"
          Copy-Item "LICENSE" -Destination "$dist/LICENSE"
          Compress-Archive -Path "$dist/*" -DestinationPath $zipName -Force
          Write-Host "Created archive: $zipName"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag -or $tag -eq "" -or $tag -like "*/*") { $tag = "v1.0.1" }
          $zipFile = Get-Item AntiDPI-*-windows-x64.zip | Select-Object -First 1 -ExpandProperty FullName
          $exeFile = Get-Item bin/antidpi.exe | Select-Object -First 1 -ExpandProperty FullName

          $releaseNotes = @"
          ## AntiDPI $tag - Standalone TCP Desync & Bypass Engine

          ### What's New in $tag:
          - **Zero-Risk Transparent Mode:** Removed all system-wide proxy hijacking and persistent registry environment variables. General internet traffic (Google, YouTube, other games) is 100% untouched and safe.
          - **Full Discord Support:** Added complete Cloudflare Anycast edge pinning and root-domain ClientHello desynchronization for Discord desktop app, gateway (`gateway.discord.gg`), assets (`cdn.discordapp.com`), and voice signaling.
          - **Full Roblox Support:** Web authentication, asset streaming, and in-game server joining.
          - **Instant Emergency Reset:** Bundled `reset.bat` for one-click factory reset of all network and hosts settings.
          - **Crash-Resilient Hosts Management:** Clean restoration on exit with backward-compatible block scrubbing.

          ### Quick Start:
          1. Download `AntiDPI-$tag-windows-x64.zip` below.
          2. Extract the archive to any folder.
          3. Right-click `run.bat` and select **Run as Administrator**.
          4. Open Roblox or Discord and enjoy!
          "@

          # Delete existing tag release if re-running
          try {
            gh release delete $tag --yes --cleanup-tag
          } catch {
            Write-Host "No existing release for $tag to clean up"
          }

          gh release create $tag $zipFile $exeFile `
            --title "AntiDPI $tag - Standalone TCP Desync & Bypass Engine" `
            --notes $releaseNotes
